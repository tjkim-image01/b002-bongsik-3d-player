<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 봉식이 찐이야</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body data-mode="public">
<header>
  <h1>b002 v2 · 3D 봉식이 「찐이야」 1분</h1>
  <p>원작 댄서 관절(졸라맨)을 그대로 따라 움직이는 3D 봉식이 · 원곡 12~72초</p>
</header>
<main>
  <section class="panel">
    <h2>원작 댄서</h2>
    <div class="stage" id="srcStage">
      <video id="video" src="media/dancer.mp4" muted playsinline preload="auto"></video>
      <canvas id="overlay"></canvas>
    </div>
  </section>
  <section class="panel">
    <h2>졸라맨 (원작 관절)</h2>
    <div class="stage"><canvas id="stick"></canvas></div>
  </section>
  <section class="panel wide">
    <h2>3D 봉식이</h2>
    <div class="stage" id="threeStage"><canvas id="three"></canvas>
      <div id="loading">3D 봉식이 불러오는 중…</div>
      <div id="lyric"></div>
      <div id="syl" hidden></div>
      <div id="poseEdit" hidden>
        <div class="row">부위 <select id="peP"><option value="LeftArm">왼팔(화면 오른쪽)</option><option value="RightArm">오른팔(화면 왼쪽)</option><option value="Body">몸 방향</option></select>
          <b id="peWhere">·</b> <button id="pePrev">◀ 키</button><button id="peNext">키 ▶</button></div>
        <div class="row arm">들기 <input id="peE" type="range" min="0" max="180"><span id="peEv"></span>
          앞뒤 <input id="peA" type="range" min="-180" max="180"><span id="peAv"></span>
          굽힘 <input id="peB" type="range" min="0" max="160"><span id="peBv"></span>
          굽힘 방향 <input id="peD" type="range" min="-90" max="90"><span id="peDv"></span> <small>(0 앞 · 90 안쪽)</small></div>
        <div class="row body" hidden>방향 <input id="peY" type="range" min="-180" max="180"><span id="peYv"></span> <small>(0 정면 · 90 화면 오른쪽 · ±180 뒤)</small></div>
        <div class="row"><button id="peRead">지금 자세 읽기</button> <button id="peDel">이 키 지우기</button> <button id="peListen">▶ 앞뒤 1초 보기</button>
          <button id="peSave">저장·적용</button> <span id="peMsg"></span></div>
      </div>
      <div id="sylEdit" hidden>
        <div class="row"><button id="sePrev">◀ 이전</button> <b id="seName">·</b> <button id="seNext">다음 ▶</button>
          번호로 가기 <input id="seGo" type="number" min="1" style="width:56px" placeholder="번호"></div>
        <div class="row">첫소리 <select id="seOn"></select> 모음 <select id="seVw"></select> 받침 <select id="seCo"></select></div>
        <div class="row">시작 <button data-se="a,-1">−</button><span id="seA"></span><button data-se="a,1">+</button>
          끝 <button data-se="b,-1">−</button><span id="seB"></span><button data-se="b,1">+</button> <small>(1칸 = 1/30초)</small></div>
        <div class="row"><button id="seListen">▶ 이 음절 듣기</button> <button id="seSplit" title="멈춘 위치에서 늘여 부르기로 나눔: 당 → 다 + 앙">✂ 여기서 나누기</button> <button id="seSave">저장·적용</button> <span id="seMsg"></span></div>
      </div>
    </div>
  </section>
</main>
<footer>
  <button id="play" aria-label="재생">▶ 재생</button>
  <span id="clock">0:00.0 / 1:00.0</span>
  <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="재생 위치">
  <label>속도 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></label>
  <label><input type="checkbox" id="singOnly"> 노래만(입 교정)</label>
  <button id="half" aria-pressed="false">½ 속도</button>
  <label><input type="checkbox" id="poseOn"> 자세 교정</label>
  <label><input type="checkbox" id="showOverlay" checked> 원작 위 졸라맨</label>
  <label><input type="checkbox" id="showBones"> 3D 뼈대</label>
  <span class="cams">
    <button data-cam="front" aria-pressed="true">정면</button>
    <button data-cam="three4">반측면</button>
    <button data-cam="side">옆</button>
  </span>
</footer>
<audio id="audio" src="media/jjin-12-72s.m4a" preload="auto"></audio>
<script type="module" src="main.js"></script>
</body>
</html>
